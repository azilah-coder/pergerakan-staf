<style>
:root{
  --bg:#f3f6f4; --surface:#fff; --surface-2:#f6f8f7; --ink:#14201a; --ink-2:#3f4d45; --muted:#66746c; --line:#e1e8e4;
  --brand-ink:#15803d; --brand-soft:#e3f5ea; --gold:#f2b705;
  --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --shadow:0 1px 2px rgba(10,40,25,.06),0 10px 30px -12px rgba(10,40,25,.18);
  --shadow-lg:0 2px 4px rgba(10,40,25,.06),0 24px 48px -16px rgba(10,40,25,.3);
  --vh:100vh; --hdr-bg:rgba(243,246,244,.88);
}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#14211b; --surface-2:#1a2a22; --ink:#ecf6f0; --ink-2:#c6d6cc; --muted:#8fa498; --line:#25382e;
  --brand-ink:#6ee7a0; --brand-soft:#173826; --hdr-bg:rgba(12,21,17,.88);
  --good:#4ade80; --good-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2a0c; --bad:#f87171; --bad-soft:#3b1414;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -16px rgba(0,0,0,.75);
}
@supports (height:100dvh){:root{--vh:100dvh}}
/* PC (≥1200px): seluruh app diskala 80% (seperti zoom pelayar 80%). */
@media (min-width:1200px){ html:not(.tv-on){--vh:125vh} html:not(.tv-on) .wrap{zoom:.8} }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ic{width:20px;height:20px;flex:none}
.wrap{min-height:var(--vh)}
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 24px;padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--hdr-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand .lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(140deg,#16a34a,#0d9488);box-shadow:0 8px 18px -10px #16a34a}
.brand .lg .ic{width:21px;height:21px}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.15}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:all .2s}
.tbtn:hover{color:var(--brand-ink);border-color:var(--brand-ink)}
.hlink{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.hlink .ic{width:16px;height:16px}
.inst{display:none;align-items:center;gap:7px;height:40px;padding:0 13px;border-radius:12px;font-size:13px;font-weight:800;color:#14532d;background:linear-gradient(140deg,#ffd54a,#f2b705);white-space:nowrap;flex:none}
.inst.show{display:inline-flex}
.inst .ic{width:17px;height:17px}
/* fill-mode backwards (bukan both): selepas animasi tiada transform kekal, jadi bar tab tetap (fixed) di telefon ikut skrin */
.view{max-width:1200px;margin:0 auto;padding:22px 24px 40px;animation:fadeUp .35s ease-out backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:#16a34a;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px}
.st .ic{width:13px;height:13px}
.st.good{background:var(--good-soft);color:var(--good)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
.logo{border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background:linear-gradient(140deg,#16a34a,#0d9488)}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:160;background:#14201a;color:#fff;font-size:13.5px;font-weight:600;
  padding:11px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:all .3s;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.upd{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 16px;border-radius:14px;background:#14201a;color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.35);max-width:calc(100vw - 24px)}
.upd button{padding:8px 12px;border-radius:10px;background:var(--gold);color:#14532d;font-weight:800}
.mdl{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:16px}
.mdl-bg{position:absolute;inset:0;background:rgba(5,20,12,.55);opacity:0;transition:opacity .2s}
.mdl-box{position:relative;width:min(520px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;border-radius:20px;background:var(--surface);color:var(--ink);
  box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden;transform:translateY(12px) scale(.98);opacity:0;transition:transform .22s,opacity .22s}
.mdl.show .mdl-bg{opacity:1} .mdl.show .mdl-box{transform:none;opacity:1}
.guide{padding:22px}
.guide h2{margin:0 0 6px;font-size:19px}
.guide ol{margin:12px 0 16px;padding-left:20px;display:grid;gap:10px;font-size:14px}
.guide ol .ic{width:16px;height:16px;vertical-align:-3px;color:var(--brand-ink)}
.guide .ok{width:100%;justify-content:center;display:inline-flex;padding:12px;border-radius:12px;background:#16a34a;color:#fff;font-weight:800}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
html.tv-on .hdr{display:none}
html.tv-on .wrap{zoom:1}
@media (max-width:620px){
  .hdr{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));gap:8px}
  .brand small,.hlink span,.inst b{display:none}
  .hlink,.inst{padding:0 11px}
  .view{padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
  /* Tab papan menjadi bar navigasi berikon di bawah skrin */
  .kb-tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;border-radius:0!important;border:0!important;border-top:1px solid var(--line)!important;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom))!important;background:var(--surface)!important;box-shadow:0 -8px 24px -12px rgba(10,40,25,.25)}
  .toast,.upd{bottom:calc(86px + env(safe-area-inset-bottom))}
  .mdl{padding:0;place-items:end stretch}
  .mdl-box{width:100%!important;max-height:92vh;border-radius:20px 20px 0 0;transform:translateY(40px);padding-bottom:env(safe-area-inset-bottom)}
}
@media print{.hdr,.toast,.upd{display:none!important} .wrap{zoom:1!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  map:'<path d="M14.1 5.55a2 2 0 0 0 1.79 0l3.66-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.55 2.27a2 2 0 0 1-1.79 0l-4.21-2.1a2 2 0 0 0-1.79 0l-3.66 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.55-2.27a2 2 0 0 1 1.79 0z"/><path d="M15 5.76v15M9 3.24v15"/>',

const ic = n => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || ICONS.globe) + '</svg>';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
const BLN = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function openModal(inner, cls) {
  closeModal();
  const m = document.createElement('div'); m.className = 'mdl' + (cls ? ' ' + cls : ''); m.id = 'mdl';
  m.innerHTML = '<div class="mdl-bg" data-close></div><div class="mdl-box" role="dialog" aria-modal="true">' + inner + '</div>';
  $('#app').appendChild(m);
  m.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); closeModal(); } });
  requestAnimationFrame(() => m.classList.add('show'));
  const f = m.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea');
  if (f && matchMedia('(pointer:fine)').matches) setTimeout(() => f.focus(), 60);
  return m;
}
function closeModal() { const m = $('#mdl'); if (m) m.remove(); }
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });

/* Pautan ke eBOARD (pilihan, dalam config.js) */
if (window.EBOARD_URL) { const l = $('#eboardLink'); l.href = window.EBOARD_URL; l.hidden = false; }

/* Tema */
const html = document.documentElement;
function applyTheme(t) { html.setAttribute('data-theme', t); $('#themeBtn').innerHTML = ic(t === 'dark' ? 'sun' : 'moon'); }
let theme = store.get('pg-theme', null) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(theme);
$('#themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme); store.set('pg-theme', theme); };

/* Penghala: #/pergerakan[/minggu|saya|admin|tv] */
function route() { const p = location.hash.replace(/^#\/?/, '').split('/'); return {v: p[0] || '', a: p[1] || ''}; }
function go(path) { if (location.hash !== '#/' + path) location.hash = '/' + path; else render(); }
function render() {
  const r = route();
  if (r.v !== 'pergerakan') { location.replace('#/pergerakan'); return; }
  html.classList.remove('tv-on');
  closeModal();
  $('#view').outerHTML = '<main id="view">' + KB.view(r.a) + '</main>';
  document.title = KB.title() + ' · Pergerakan Staf JTMK';
  window.scrollTo(0, 0);
  KB.bind();
}
addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* PWA: pasang aplikasi & kemas kini */
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android/i.test(navigator.userAgent);
let installEvt = null;
function syncInstall() { $('#installBtn').classList.toggle('show', !standalone() && (!!installEvt || isMobile)); }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; syncInstall(); });
addEventListener('appinstalled', () => { installEvt = null; syncInstall(); toast('✓ Pergerakan Staf dipasang pada peranti ini'); });
$('#installBtn').onclick = async () => {
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; syncInstall(); return; }
  const langkah = isIOS
    ? '<p class="hint" style="margin:0">Buka laman ini dalam <b>Safari</b>, kemudian:</p><ol><li>Tekan butang <b>Kongsi</b> ' + ic('share') + ' di bawah skrin.</li><li>Pilih <b>Tambah ke Skrin Utama</b>.</li><li>Tekan <b>Tambah</b>.</li></ol>'
    : '<p class="hint" style="margin:0">Buka laman ini dalam <b>Chrome</b>, kemudian:</p><ol><li>Tekan menu <b>⋮</b> di penjuru kanan atas.</li><li>Pilih <b>Pasang aplikasi</b> atau <b>Tambah ke skrin utama</b>.</li><li>Tekan <b>Pasang</b>.</li></ol>';
  openModal('<div class="guide"><h2>Pasang Pergerakan Staf</h2>' + langkah + '<button class="ok" data-close>Faham</button></div>');
};
syncInstall();
if ('serviceWorker' in navigator && window.isSecureContext) {
  let mahuMuat = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (mahuMuat) location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const tawar = w => {
      if ($('#upd')) return;
      const d = document.createElement('div'); d.className = 'upd'; d.id = 'upd';
      d.innerHTML = '<span>Versi baharu tersedia</span><button>Muat semula</button>';
      d.querySelector('button').onclick = () => { mahuMuat = true; w.postMessage('skipWaiting'); d.remove(); };
      document.body.appendChild(d);
    };
    if (reg.waiting && navigator.serviceWorker.controller) tawar(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) tawar(w); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});
}

render();
</script>
